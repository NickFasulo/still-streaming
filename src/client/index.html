<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still Streaming?</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #14181c;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
        touch-action: manipulation;
      }
      #root { max-width: 560px; margin: 0 auto; padding: 12px 14px 18px; }
      .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
      .brand { color: #7aa2e0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
      .expand {
        background: none; border: 1px solid #2f3a49; color: #94a3b8;
        border-radius: 8px; padding: 3px 10px; font-size: 11px; cursor: pointer;
      }
      .expand:hover { border-color: #7aa2e0; color: #7aa2e0; }
      h1 { font-size: 19px; margin-bottom: 3px; }
      .sub { color: #94a3b8; font-size: 12.5px; margin-bottom: 12px; }
      .card { background: #1a2028; border: 1px solid #2a3442; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
      .prompt { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.35; }
      .opt {
        display: block; width: 100%; text-align: left; cursor: pointer;
        background: #232b36; color: #e2e8f0; border: 1px solid #2f3a49;
        border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 6px; line-height: 1.3;
        transition: border-color 0.15s, background 0.15s, transform 0.08s;
      }
      .opt:hover:not(:disabled) { border-color: #2b6cb0; background: #26303d; }
      .opt:active:not(:disabled) { transform: scale(0.98); }
      .opt:disabled { cursor: default; opacity: 0.85; }
      .opt.correct { background: #1c3a2a; border-color: #38a169; animation: pop 0.35s ease; }
      .opt.wrong { background: #3a1f22; border-color: #c53030; animation: shake 0.3s ease; }
      .opt.dim { opacity: 0.5; }
      .meta { display: flex; justify-content: space-between; color: #94a3b8; font-size: 12px; margin-bottom: 10px; }
      .link { display: inline-block; margin-top: 8px; color: #7aa2e0; font-size: 13px; }
      .primary {
        background: #2b6cb0; color: #fff; border: none; border-radius: 10px;
        padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
      }
      .primary:disabled { opacity: 0.5; cursor: default; }
      .score-big { font-size: 30px; font-weight: 700; color: #7aa2e0; animation: pop 0.45s ease 0.1s both; }
      .center { text-align: center; }
      .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #232b36; font-size: 14px; }
      .stage { position: relative; }
      .scorewrap { position: relative; }
      .plus {
        position: absolute; left: 100%; margin-left: 6px; top: -2px;
        color: #38a169; font-weight: 700; font-size: 12px; font-style: normal;
        animation: floatup 0.9s ease-out both;
      }
      .done { position: relative; overflow: hidden; animation: rise 0.3s ease both; }
      .confetti i {
        position: absolute; top: -10px; width: 6px; height: 10px; border-radius: 2px;
        animation: drop 1.7s ease-in forwards;
      }
      .qcard { animation: qin 0.3s ease both; }
      .qcard.exit {
        position: absolute; top: 0; left: 0; right: 0;
        pointer-events: none;
        animation: qout 0.22s ease both;
      }
      @keyframes qin { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
      @keyframes qout { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-28px); } }
      @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
      @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes floatup { 0% { opacity: 0; transform: translateY(2px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
      @keyframes drop { to { transform: translateY(340px) rotate(540deg); } }
      .next { margin-top: 4px; animation: rise 0.25s ease both; }
      /* The slate (up to 8 rows) scrolls inside its own region so the Lock-in
         button stays visible even when the inline view is short. */
      .slate { max-height: 296px; overflow-y: auto; }
      .vote-opt { display: flex; align-items: center; gap: 9px; }
      .vote-opt.on { border-color: #2b6cb0; background: #243449; }
      .vote-opt input { accent-color: #2b6cb0; width: 15px; height: 15px; flex-shrink: 0; }
      .toast { color: #68d391; font-size: 13px; margin-top: 6px; animation: rise 0.25s ease both; }
      @media (prefers-reduced-motion: reduce) {
        .qcard, .qcard.exit, .opt.correct, .opt.wrong, .next, .plus, .done, .score-big, .toast { animation: none !important; }
        .confetti { display: none; }
      }
      .err { color: #fc8181; font-size: 13px; margin-top: 6px; }
      .footer { color: #64748b; font-size: 11px; text-align: center; margin-top: 6px; }
      .footer a { color: #94a3b8; }
      /* Inline posts can render well under the 512px request on the mobile
         app — compress so a full question still fits without scrolling. */
      @media (max-height: 440px) {
        #root { padding-top: 8px; padding-bottom: 10px; }
        .sub { display: none; }
        h1 { font-size: 16px; margin-bottom: 2px; }
        .meta { margin-bottom: 6px; }
        .card { padding: 10px 12px; margin-bottom: 8px; }
        .prompt { font-size: 14px; margin-bottom: 8px; }
        .opt { padding: 8px 11px; margin-bottom: 5px; }
        .primary { padding: 9px 16px; }
        .next { margin-top: 2px; }
        .slate { max-height: 190px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
